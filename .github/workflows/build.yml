name: Build TrustLens Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev automake

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cython==0.29.36" "buildozer==1.5.0"

      - name: Validate TrustLens configuration
        run: |
          grep -q '^title = TrustLens$' buildozer.spec
          grep -q '^package.name = trustlensv8$' buildozer.spec
          grep -q '^package.domain = org.trustlens$' buildozer.spec
          grep -q '^android.api = 33$' buildozer.spec
          grep -q '^p4a.branch = v2024.01.21$' buildozer.spec
          test -s main.py
          python -m py_compile main.py

      - name: Build debug APK
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Verify APK exists and is a valid ZIP
        run: |
          shopt -s nullglob
          apks=(bin/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one APK in bin/, found ${#apks[@]}."
            find bin -maxdepth 1 -type f -ls 2>/dev/null || true
            exit 1
          fi
          apk="${apks[0]}"
          test -s "$apk"
          unzip -t "$apk"
          ls -lh "$apk"
          sha256sum "$apk"

      - name: Show build diagnostics on failure
        if: failure()
        run: |
          if [ -f build.log ]; then
            echo "===== LAST 250 LINES OF BUILD LOG ====="
            tail -n 250 build.log
            echo "===== MATCHING ERRORS ====="
            grep -n -i -E 'error:|exception|command failed|failed|failure|traceback|not supported wheel' build.log | tail -n 100 || true
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrustLens-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrustLens-V8-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip libffi-dev libssl-dev autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libopenblas-dev libltdl-dev
          pip install --upgrade pip
          pip install "cython==0.29.36" "buildozer==1.5.0"
      - name: Build APK
        run: |
          yes | buildozer android debug > build.log 2>&1; echo "EXIT:$?" >> build.log; tail -n 100 build.log
      - name: Show real error
        if: always()
        run: |
          echo "===== REAL ERROR ====="
          grep -n -B 5 -A 2 "Traceback\|FAILURE\|What went wrong\|FAILED\|Exception" build.log | head -n 120 || true
          echo "===== END ====="
      - name: Upload log on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrustLens-V8-APK
          path: bin/*.apk

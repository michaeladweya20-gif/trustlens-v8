name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk python3-pip zip unzip libffi-dev libssl-dev autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libopenblas-dev
          pip install --upgrade pip
          pip install "cython==0.29.36" "buildozer==1.5.0"

      - name: Build APK
        run: |
          set -o pipefail
          yes | buildozer android debug 2>&1 | tee build.log | tail -n 500
          echo "=== TAIL OF LOG ==="
          tail -n 300 build.log

      - name: Upload log on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrustLens-V8-APK
          path: bin/*.apk
